name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SKILL.md files
        run: |
          set -e
          FAILED=0
          for file in $(find skill skills -name "SKILL.md" 2>/dev/null | sort); do
            if ! head -1 "$file" | grep -q "^---"; then
              echo "FAIL: $file missing frontmatter"
              FAILED=$((FAILED + 1))
            else
              echo "PASS: $file"
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED SKILL.md file(s) failed validation — aborting release."
            exit 1
          fi
          echo "All SKILL.md files valid."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
